{% extends "base.html" %}
{% block content %}
    <!-- Content on the right side-->
    <h1>Games</h1>
    <!-- List Games available -->
    <div class="gameslist">
        {% for game in games %}
            <div class="game">
                <img src="{{ "img/" + game + ".png"}}">
                <p>{{ game }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
